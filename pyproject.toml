[project]
name = "ai-logistics-comp-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pratap V", email = "vpratapchoudary@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "duckduckgo-search>=8.1.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "streamlit>=1.64.0",
]

[project.scripts]
ai-logistics-comp-assistant = "ai_logistics_comp_assistant:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
